<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uptime Wars</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div class="stat"><span class="label">Compute</span><span id="compute">0</span></div>

      <div id="stage"></div>
      <footer id="build-bar"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
