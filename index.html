<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uptime Wars</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div class="stat"><span class="label">Uptime</span><span id="uptime">0:00</span></div>
        <div class="stat"><span class="label">Compute</span><span id="compute">0</span></div>
        <div class="stat"><span class="label">Core</span><span id="core">0</span></div>
        <div class="stat"><span class="label">Wave</span><span id="wave">0</span></div>
        <div class="stat"><span class="label">Next wave</span><span id="next-wave">-</span></div>
        <div id="status"></div>
      </header>
      <div id="stage">
        <section id="race-picker" hidden>
          <h1>Uptime Wars</h1>
          <p>Choose who you're keeping online.</p>
          <div id="race-cards"></div>
          <small>Click a race, or press its number.</small>
        </section>
        <aside id="info" hidden>
          <strong id="info-title"></strong>
          <em id="info-subtitle"></em>
          <ul id="info-lines"></ul>
        </aside>
      </div>
      <footer id="build-bar"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
