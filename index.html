<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uptime Wars</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div class="stat"><span class="label">Uptime</span><span id="uptime">0:00</span></div>
        <div class="stat"><span class="label">$</span><span><span id="money">0</span> <small id="income"></small></span></div>
        <div class="stat" id="compute-stat"><span class="label">Compute</span><span id="compute">0</span></div>
        <div class="stat"><span class="label">Users</span><span><span id="users">0</span> <small id="churn"></small> <small id="sites"></small></span></div>
        <div class="stat"><span class="label">Core</span><span id="core">0</span></div>
        <div class="stat" id="nest-stat" title="The botnet's core. Shielded while any Botnet Farm stands: break the farms, then take the nest offline to win."><span class="label">Nest</span><span id="nest">-</span></div>
        <div class="stat preview"><span class="label"><span id="preview-title"></span> <span id="next-wave"></span> <b id="threat" title="The botnet has noticed how big your base is: incidents are this much bigger"></b></span><span id="preview-creeps"></span></div>
        <div id="status"></div>
        <button id="sound" type="button" title="Sound: on / effects only / off (M)">Sound: on</button>
      </header>
      <div id="stage">
        <section id="race-picker" hidden>
          <h1>Uptime Wars</h1>
          <p id="picker-title">Choose who you're keeping online, then how to play.</p>
          <div id="race-cards"></div>
          <div id="picker-actions">
            <button id="play-solo" class="picker-mode primary" type="button"><strong>Play solo</strong><small>You against the botnet · Enter</small></button>
            <button id="quick-match" class="picker-mode" type="button"><strong>Quick Match</strong><small>Co-op with whoever's around · Q</small></button>
            <button id="custom-match" class="picker-mode" type="button"><strong>Custom match</strong><small>Friends, computers, free-for-all · C</small></button>
          </div>
          <footer id="picker-footer">
            <div id="color-row"><small>Your colour</small><div id="color-swatches"></div></div>
            <button id="picker-guide" type="button">Guide (G)</button>
            <label id="stats-row"><input type="checkbox" id="share-stats"> Share anonymous match stats</label>
          </footer>
        </section>
        <section id="coop" hidden>
          <div class="coop-window">
            <button id="coop-close" aria-label="Close">×</button>
            <div id="coop-body"></div>
          </div>
        </section>
        <div id="countdown" hidden><small id="countdown-label"></small><strong id="countdown-time"></strong></div>
        <div id="hint"></div>
        <aside id="players" hidden></aside>
        <div id="hero-panel">
          <button id="hero-card" type="button" hidden title="Select your hero (Q)">
            <span class="hero-top"><strong id="hero-name"></strong><span id="hero-level"></span></span>
            <span id="hero-xp"></span>
            <small id="hero-status"></small>
          </button>
          <div id="hero-items" hidden></div>
        </div>
        <aside id="info" hidden>
          <strong id="info-title"></strong>
          <ul id="info-lines"></ul>
          <button id="info-action" type="button" hidden></button>
          <button id="info-invoke" class="info-button" type="button" hidden></button>
          <button id="info-fork" class="info-button" type="button" hidden></button>
          <button id="info-rank" class="info-button" type="button" hidden></button>
          <button id="info-remove" class="info-button" type="button" hidden></button>
        </aside>
        <section id="guide" hidden>
          <div class="guide-window">
            <header>
              <nav id="guide-tabs"></nav>
              <button id="guide-close" aria-label="Close">×</button>
            </header>
            <div id="guide-body"></div>
          </div>
        </section>
      </div>
      <footer id="build-bar"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
