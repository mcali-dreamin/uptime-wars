<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uptime Wars</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div class="stat"><span class="label">Uptime</span><span id="uptime">0:00</span></div>
        <div class="stat"><span class="label">Compute</span><span><span id="compute">0</span> <small id="income"></small></span></div>
        <div class="stat"><span class="label">Users</span><span><span id="users">0</span> <small id="churn"></small></span></div>
        <div class="stat"><span class="label">Core</span><span id="core">0</span></div>
        <div class="stat"><span class="label">Wave</span><span id="wave">0</span></div>
        <div class="stat"><span class="label">Next wave</span><span id="next-wave">-</span></div>
        <div class="stat preview"><span class="label" id="preview-title"></span><span id="preview-creeps"></span></div>
        <div id="status"></div>
      </header>
      <div id="stage">
        <section id="race-picker" hidden>
          <h1>Uptime Wars</h1>
          <p>Choose who you're keeping online.</p>
          <div id="race-cards"></div>
          <div id="color-row"><small>Your colour</small><div id="color-swatches"></div></div>
          <button id="coop-host" type="button">Play co-op with friends (H)</button>
        </section>
        <section id="coop" hidden>
          <div class="coop-window">
            <button id="coop-close" aria-label="Close">×</button>
            <div id="coop-body"></div>
          </div>
        </section>
        <div id="hint"></div>
        <aside id="info" hidden>
          <strong id="info-title"></strong>
          <ul id="info-lines"></ul>
          <button id="info-action" type="button" hidden></button>
        </aside>
        <section id="guide" hidden>
          <div class="guide-window">
            <header>
              <nav id="guide-tabs"></nav>
              <button id="guide-close" aria-label="Close">×</button>
            </header>
            <div id="guide-body"></div>
          </div>
        </section>
      </div>
      <footer id="build-bar"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
