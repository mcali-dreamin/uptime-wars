# Build a ref and publish it to the production Spacefast space.
#
# Called by release.yml after every release. Also runnable by hand to
# redeploy a tag (or main) without cutting a new release.

name: Deploy

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (tag, branch, or SHA) to deploy'
        type: string
        required: true
      message:
        description: 'Version note shown in Spacefast history'
        type: string
        required: false
        default: ''
    secrets:
      SPACEFAST_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag, branch, or SHA) to deploy'
        type: string
        required: true
        default: main
      message:
        description: 'Version note shown in Spacefast history'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: spacefast-production
  cancel-in-progress: false

env:
  # Space IDs are stable across renames. Not a secret.
  SPACEFAST_SPACE: spc_de286293390947f7beb1d37d7205b6e5
  SPACEFAST_CLI_VERSION: 0.4.1

jobs:
  deploy:
    name: Publish to Spacefast
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.publish.outputs.url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Publish
        id: publish
        env:
          SPACEFAST_TOKEN: ${{ secrets.SPACEFAST_TOKEN }}
          SPACEFAST_PUBLISH_MESSAGE: ${{ inputs.message || inputs.ref }}
          SPACEFAST_YES: '1'
        run: |
          set -euo pipefail
          npx -y "spacefast@${SPACEFAST_CLI_VERSION}" publish dist \
            --space "$SPACEFAST_SPACE" \
            --target production \
            --wait \
            --json > publish.json
          url=$(node -e 'const d=require("./publish.json").data; console.log(d.space.liveUrl)')
          version=$(node -e 'const d=require("./publish.json").data; console.log(d.version.immutableUrl)')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed ${{ inputs.ref }} to Spacefast"
            echo ""
            echo "- Live: $url"
            echo "- This version: $version"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke check
        run: |
          set -euo pipefail
          status=$(curl -sS -o /dev/null -w '%{http_code}' "${{ steps.publish.outputs.url }}")
          echo "Live URL returned $status"
          if [ "$status" != "200" ]; then
            echo "::warning::Live URL returned $status. If the space is private, this is expected; set its access to public to serve players."
          fi
