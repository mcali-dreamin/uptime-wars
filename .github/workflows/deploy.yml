# Build a release and publish it to the production Spacefast space.
#
# Called by release.yml after every Homeboy release. Also runnable by hand to
# redeploy an existing tag without cutting a new release.
#
# The build is attached to the GitHub Release as uptime-wars-<tag>.zip, and
# the bytes in that zip are exactly what gets published. Spacefast keeps every
# publish as an immutable version, so rollback is `sf rollback` or promoting an
# older version in the dashboard.
#
# Interim: this calls the Spacefast CLI directly. It moves behind a Homeboy
# `spacefast` deployment provider once a second Spacefast project needs one.

name: Deploy

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to deploy (e.g. v0.2.0)'
        type: string
        required: true
    secrets:
      SPACEFAST_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (e.g. v0.2.0)'
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: spacefast-production
  cancel-in-progress: false

env:
  # The build (dist/) is the static game plus a Spacefast Zero server for
  # co-op invites (zero/, staged by scripts/stage-zero.mjs). Zero needs CLI
  # 0.5.0+ to compile it on publish.
  # Space IDs survive renames. Not a secret.
  SPACEFAST_SPACE: spc_de286293390947f7beb1d37d7205b6e5
  SPACEFAST_CLI_VERSION: 0.5.0

jobs:
  deploy:
    name: Publish to Spacefast
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ steps.publish.outputs.url }}
    steps:
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' is not a release tag"; exit 1; }

      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Browser smoke test
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Attach build to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          zip="uptime-wars-${TAG}.zip"
          (cd dist && zip -qr "../${zip}" .)
          gh release upload "$TAG" "$zip" --clobber --repo "$GITHUB_REPOSITORY"
          echo "ZIP=${zip}" >> "$GITHUB_ENV"

      - name: Publish the release zip
        id: publish
        env:
          SPACEFAST_TOKEN: ${{ secrets.SPACEFAST_TOKEN }}
          SPACEFAST_PUBLISH_MESSAGE: ${{ inputs.tag }}
          SPACEFAST_YES: '1'
        run: |
          set -euo pipefail
          # Publish from the zip's contents, not the working dist/, so what is
          # live is byte-for-byte the release asset.
          rm -rf publish && mkdir publish && unzip -q "$ZIP" -d publish
          npx -y "spacefast@${SPACEFAST_CLI_VERSION}" publish publish \
            --space "$SPACEFAST_SPACE" \
            --target production \
            --wait \
            --json > publish.json
          node -e '
            const d = require("./publish.json").data;
            const fs = require("fs");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=${d.space.liveUrl}\nversion=${d.version.immutableUrl}\n`);
          '

      - name: Summary
        env:
          TAG: ${{ inputs.tag }}
          URL: ${{ steps.publish.outputs.url }}
          VERSION_URL: ${{ steps.publish.outputs.version }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' "$URL" || true)
          {
            echo "### Deployed ${TAG} to Spacefast"
            echo ""
            echo "- Live: ${URL} (HTTP ${status})"
            echo "- This version: ${VERSION_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" = "403" ]; then
            echo "::notice::Live URL returned 403: the space is private. Set its access to public to serve players."
          fi
