# Continuous release + deploy.
#
# Every push to main runs the Homeboy release pipeline: it derives the version
# from conventional commits since the last tag (fix: -> patch, feat: -> minor,
# BREAKING CHANGE -> major; chore:/ci:/docs:/test: -> no release), runs the
# quality gates, tags, writes the changelog, and creates the GitHub Release.
#
# When a release is cut, deploy.yml builds that tag, attaches the zip to the
# release, and publishes it to Spacefast. No release, no deploy.

name: Release

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Preview the release without making changes'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: Extra-Chill/homeboy-action/.github/workflows/release.yml@v2
    with:
      dry-run: ${{ inputs.dry-run || false }}
      node-version: '24'
      # A private game, not an npm package. deploy.yml ships it.
      release-skip-publish: true
    secrets: inherit

  deploy:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.release.outputs.release-tag }}
    secrets: inherit
